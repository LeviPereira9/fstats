# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Cache real (Redis via Testcontainers)
spring.cache.type=redis

api.prefix=api/v1

# JWT
api.security.token.secret=chave-secreta-de-teste-123456

# Brevo (mockado, mas precisa existir por causa do @Value)
brevo.name=Test
brevo.email=test@test.com
brevo.url=http://localhost
brevo.header=api-key
brevo.key=fake-key

# Football API (mockado, idem)
api.external.url=http://localhost
api.external.key=X-Auth-Token
api.external.value=fake-key